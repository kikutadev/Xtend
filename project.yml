name: Xtend
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "18.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Xtend:
    type: application
    platform: iOS
    sources:
      - path: Xtend/Sources
      - path: Xtend/Resources/Assets.xcassets
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.xtend
        PRODUCT_NAME: Xtend
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Xtend"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - XtendTests
        - XtendUITests
  XtendUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: XtendUITests
    dependencies:
      - target: Xtend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.xtend.uitests
        GENERATE_INFOPLIST_FILE: YES
  XtendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XtendTests
    dependencies:
      - target: Xtend
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.xtend.tests
        GENERATE_INFOPLIST_FILE: YES